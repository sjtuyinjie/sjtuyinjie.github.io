{% include base_path %}

<header class="site-nav" id="site-nav-bar">
  <div class="site-nav__inner">
    <a class="site-nav__brand" href="{{ base_path }}/">Jie Yin</a>

    <button class="site-nav__burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav-menu">
      <span></span><span></span><span></span>
    </button>

    <div class="site-nav__right" id="site-nav-menu">
      <nav class="site-nav__links" aria-label="Primary">
        <a href="{{ base_path }}/">About</a>
        <a href="{{ base_path }}/#news">News</a>
        <a href="{{ base_path }}/#research-themes">Themes</a>
        <a href="{{ base_path }}/#publication">Publications</a>
        <a href="{{ base_path }}/#projects">Projects</a>
      </nav>
      {% include theme-toggle.html %}
    </div>
  </div>
</header>
<script>
  (function () {
    var bar = document.getElementById('site-nav-bar');
    var burger = bar && bar.querySelector('.site-nav__burger');
    var menu = document.getElementById('site-nav-menu');
    if (!bar) {
      return;
    }

    var syncNavOffset = function () {
      var offset = Math.ceil(bar.getBoundingClientRect().height);
      document.documentElement.style.setProperty('--site-nav-offset', offset + 'px');
      return offset;
    };

    var closeMenu = function () {
      if (!burger || !menu) {
        return;
      }
      bar.classList.remove('is-open');
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Open menu');
    };

    var scrollToHash = function (hash, behavior) {
      if (!hash || hash === '#') {
        return false;
      }
      var target = document.querySelector(hash);
      if (!target) {
        return false;
      }
      var offset = syncNavOffset();
      var top = window.scrollY + target.getBoundingClientRect().top - offset;
      window.scrollTo({
        top: Math.max(0, top),
        behavior: behavior || 'smooth'
      });
      return true;
    };

    syncNavOffset();
    window.addEventListener('resize', syncNavOffset);

    if (burger && menu) {
      burger.addEventListener('click', function () {
        var open = bar.classList.toggle('is-open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
        burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        syncNavOffset();
      });
    }

    document.querySelectorAll('.site-nav__links a[href*="#"]').forEach(function (link) {
      link.addEventListener('click', function (event) {
        var url = new URL(link.href, window.location.href);
        if (url.pathname.replace(/\/$/, '') !== window.location.pathname.replace(/\/$/, '')) {
          closeMenu();
          return;
        }
        if (!url.hash) {
          closeMenu();
          return;
        }
        if (scrollToHash(url.hash, 'smooth')) {
          event.preventDefault();
          history.pushState(null, '', url.hash);
        }
        closeMenu();
      });
    });

    if (window.location.hash) {
      window.setTimeout(function () {
        scrollToHash(window.location.hash, 'auto');
      }, 0);
    }
  })();
</script>
