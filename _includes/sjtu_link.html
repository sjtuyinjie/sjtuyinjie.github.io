{% assign rankings = site.data.sjtu_rankings.rankings %}
{% assign sjtu = site.data.org_previews.sjtu %}
<span class="metric-tooltip-wrap ranking-tooltip-wrap">
  <strong><a class="org-link" href="{{ sjtu.url }}" target="_blank" rel="noopener noreferrer">Shanghai Jiao Tong University</a></strong>
  <span class="about-meta-note metric-breakdown-card ranking-breakdown-card">
    <span class="stars-card-title">Global rankings</span>
    <span class="ranking-list">
      {% for item in rankings %}
      <span class="ranking-row">
        <span class="ranking-system">{{ item.system }}</span>
        <span class="ranking-value">#{{ item.rank }}</span>
        <span class="ranking-edition">{{ item.edition }}</span>
      </span>
      {% endfor %}
    </span>
    <span class="stars-updated">as of {{ site.data.sjtu_rankings.updated_at }}</span>
  </span>
</span>
